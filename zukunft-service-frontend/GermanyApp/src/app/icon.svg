<!--
  Favicon. Next serves this automatically as <link rel="icon"> - no metadata
  entry needed. The site had no favicon at all until now; browsers were showing
  the default globe.

  Tighter than public/logo.svg on purpose: at 16px the document lines and the
  leaf turn to mud, so this keeps only the shapes that survive - the document
  silhouette, the gold tick, and the broom.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="6" fill="#043b32"/>
  <path d="M8 7h8l4 4v13a1.5 1.5 0 0 1-1.5 1.5H8A1.5 1.5 0 0 1 6.5 24V8.5A1.5 1.5 0 0 1 8 7Z" fill="#fffdf9"/>
  <path d="m10.2 14.4 1.9 1.9 3.4-4" fill="none" stroke="#c48a16" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M26 5.5 20.5 13" fill="none" stroke="#e3bd52" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M17.6 17.2 21 12.2l3.6 2.5-2.1 5.6a1 1 0 0 1-1.3.6l-3.2-1.1a1 1 0 0 1-.4-1.6Z" fill="#e3bd52"/>
</svg>
