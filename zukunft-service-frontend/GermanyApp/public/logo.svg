<!--
  Zukunft Service brand mark.

  Standalone file, so every colour is a literal hex rather than a CSS token -
  design tokens do not resolve inside an <img> or when a crawler fetches this
  URL directly. The values are the same ones globals.css defines:
  brand green #075344, deep #043b32, gold #c48a16, sage #769b7e.

  Used by the LocalBusiness JSON-LD (`logo`) and available for any surface that
  needs a fetchable asset. The in-page lockup is src/components/ui/Logo.tsx.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Zukunft Service">
  <rect width="64" height="64" rx="12" fill="#fffdf9"/>
  <g transform="translate(8 8) scale(1.5)">
    <path d="M7 4.5h9.5L21 9v14.5a1.5 1.5 0 0 1-1.5 1.5H7a1.5 1.5 0 0 1-1.5-1.5v-17A1.5 1.5 0 0 1 7 4.5Z"
          fill="none" stroke="#075344" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M8.5 9.5h4v4h-4z" fill="none" stroke="#c48a16" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="m9.3 11.6 1.3 1.3 2.2-2.6" fill="none" stroke="#c48a16" stroke-width="1.4"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M8.5 16.5h9M8.5 19.5h6" fill="none" stroke="#075344" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M25.5 3.5 20 12" fill="none" stroke="#075344" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M17.2 15.6 21 10.2l3.4 2.4-2.2 6a1 1 0 0 1-1.3.6l-3.3-1.2a1 1 0 0 1-.4-1.6Z" fill="#075344"/>
    <path d="M27 15.5c0 1.4.9 2.3 2.3 2.3-1.4 0-2.3.9-2.3 2.3 0-1.4-.9-2.3-2.3-2.3 1.4 0 2.3-.9 2.3-2.3Z" fill="#c48a16"/>
    <path d="M23.5 24.5c-2.6 1-5 .2-5.6-1.7 2.3-1.9 5-2 6.4-.4.3.4.1 1.4-.8 2.1Z" fill="#769b7e"/>
  </g>
</svg>
